name: CI Python

on:
  push:
    branches: [$default-branch]
  pull_request:
    branches: [$default-branch]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt || pip install -e . || true
      - run: python -m compileall . -q
      - name: Tests
        if: hashFiles('tests/') != '' || hashFiles('test_*.py') != ''
        run: pip install pytest && python -m pytest -v
